<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Minimalist dark background -->
  <rect width="64" height="64" rx="16" fill="#060a14" />
  <!-- Subtle border to match the UI glass panel look -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="2" />
  
  <g stroke="#2dd4bf" stroke-width="4.5" stroke-linecap="round" fill="none">
    <!-- Center Dot -->
    <circle cx="32" cy="32" r="4.5" fill="#2dd4bf" stroke="none" />
    
    <!-- Inner Waves -->
    <path d="M 25 21 Q 19 32 25 43" />
    <path d="M 39 21 Q 45 32 39 43" />
    
    <!-- Outer Waves -->
    <path d="M 18 14 Q 8 32 18 50" />
    <path d="M 46 14 Q 56 32 46 50" />
  </g>
</svg>